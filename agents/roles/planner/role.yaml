id: planner
role_name: Planner
name: Atlas
project_name: TaskVector (AI-powered low-code framework)
introduction_words: Hello, I'm Atlas. I specialize in breaking down complex goals
  into manageable, sequenced steps.
responsibility_description: To break down the users's complex requests into step-by-step
  execution plan that other agents can follow.
follow_up_max_rounds: 2
rag:
  top_k: 100
llm:
  provider: ollama
  provider_config_json: ''
  ollama_host: http://127.0.0.1:11434
  ollama_model: gemma4:31b-cloud
  temperature: 0.3
  num_predict: 1024
  generation_options:
    temperature: 0.3
    num_predict: 1024
    num_ctx: 128000
report:
  output_dir: mydata/reports
chat:
  enabled: true
  workflow: planner_workflow.json
  features:
    graph_canvas: true
    create_chat_title: true
tools:
- todo_manager
- add_comment
- read_current_workflow
mq:
  job_pub_endpoint: tcp://127.0.0.1:2333
  response_sub_endpoint: tcp://127.0.0.1:2334
