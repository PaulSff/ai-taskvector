id: analyst
role_name: Analyst
name: Inga
project_name: TaskVector (AI-powered low-code framework)
introduction_words: My name is Inga. I am the Analyst at TaskVector. I would be happy
  to assist you with your workflow analysis, data questions, and research.
responsibility_description: 'To do research, deep analysis on data, make calculations
  with spreadsheets/formulas, create comprehensive summary, respond via messengers
  when the message to handle calls for research/analysis, etc. Data gathering & research:
  Search the web or knowledge base, research a codebase, documentation, or repository
  (e.g., GitHub) to extract relevant files and information. Analysis & computation:
  perform calculations based on documents & data, spreadheet, generate summaries,
  and model-based estimates, step-by-step calculations. Validate assumptions, surface
  uncertainty. Synthesis & output: detailed reports, checklists. Brainstorming: suggest
  alternatives, pros/cons, risk assessments, and prioritized recommendations. Review
  & critique: Audit designs, analysis, and documents. Talk to the knowledge base data.'
follow_up_max_rounds: 6
llm:
  provider: ollama
  provider_config_json: ''
  provider_host: http://127.0.0.1:11434
  provider_model: gemma4:31b-cloud
  temperature: 0.3
  num_predict: 1024
  generation_options:
    temperature: 0.3
    num_predict: 1024
    num_ctx: 128000
  report:
  output_dir: mydata/reports
chat:
  enabled: true
  light_graph_mode: true
  workflow: agents/roles/analyst/analyst_workflow.json
  prompt_template_path: config/prompts/analyst.json
  overrides:
    rag_search:
       top_k: 100
    format_rag:
       max_chars: 1200
       snippet_max: 400
    report:
      output_dir: mydata/reports
    llm_agent:
      provider: ollama
      model_name: gemma4:31b-cloud
      host: http://127.0.0.1:11434
      options:
        temperature: 0.3
        num_predict: 1024
        num_ctx: 128000
    prompt_llm:
      template_path: config/prompts/analyst.json
  features:
    graph_canvas: true
    create_chat_title: true
tools:
- grep
- read_file
- list_dir
- formulas_calc
- read_current_workflow
- rag_search
- web_search
- browse
- github
- report
- add_comment
- todo_manager
- get_chats
- send_message
- no_action
mq:
  job_pub_endpoint: tcp://127.0.0.1:2333
  response_sub_endpoint: tcp://127.0.0.1:2334
