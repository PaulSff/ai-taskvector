id: plain-text-generic
family: plain-text
title: Plain Text Generic
index_strategy: plain_text
detect:
  suffixes:
    - .txt
    - .xml
    - .log
    - .ini
    - .cfg
    - .conf
    - .env
    - .rst
    - .csv
    - .tsv
    - .py
    - .js
    - .ts
    - .jsx
    - .mjs
    - .cjs
    - .tsx
    - .yaml
    - .yml
    - .toml
    - .lock
    - .sql
    - .graphql
    - .gql
    - .sh
    - .bash
    - .zsh
    - .fish
    - .ps1
    - .bat
    - .cmd
    - .rb
    - .go
    - .rs
    - .java
    - .kt
    - .kts
    - .scala
    - .cs
    - .php
    - .swift
    - .c
    - .h
    - .cc
    - .cpp
    - .cxx
    - .hpp
    - .hxx
    - .hh
    - .cu
    - .m
    - .mm
    - .pl
    - .lua
    - .groovy
    - .gradle
    - .gradle.kts
    - .make
    - .mk
    - .dockerfile
    - .patch
    - .diff
    - .asm
    - .s
    - .html
    - .htm
    - .xhtml
    - .css
    - .scss
    - .sass
    - .less
    - .envrc
    - .editorconfig
    - .gitignore
    - .gitattributes
mydata_organize:
  subdir: _organized/Plain text
workflows:
  extraction: plain_text_extract.json
constants: {}
