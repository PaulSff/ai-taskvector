# App + Ollama LLM server. The app uses the Python ollama client (already in the image)
# and connects to the Ollama service via OLLAMA_HOST.
#
# Build and run:
#   docker compose build
#   docker compose up
#
# Then open the Flet GUI (see below for web vs desktop). Pull a model in Ollama:
#   docker compose exec ollama ollama pull gemma4:31b-cloud

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Optional: use GPU (uncomment and adjust for your driver)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  app:
    build: .
    container_name: ai-taskvector
    environment:
      OLLAMA_HOST: http://ollama:11434
      SKIP_OLLAMA: "1"
      PYTHONPATH: /usr/src/app
      # OLLAMA_MODEL: gemma4:31b-cloud
    depends_on:
      - ollama
    ports:
      - "8550:8550"
      # Web UI:
      # ["bash", "./run.sh", "--web", "-p", "8550"]
      # then open http://127.0.0.1:8550/ in your web browser
      # Override with this for headless mode:
      # command: ["bash", "./run.sh", "--no_gui"]
      # Native GUI:
      # command: ["bash", "./run.sh"]
    command: ["bash", "./run.sh", "--web", "-p", "8550"]
    restart: "no"

volumes:
  ollama_data:
